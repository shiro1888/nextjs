<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>秒杀倒计时</title>
<!--
  【案例名】秒杀倒计时
  【练什么】Date 对象、时间戳计算、setInterval / clearInterval、padStart 补零
  【怎么运行】直接双击本文件,在浏览器中打开即可(目标时间 = 打开页面后 10 分钟)
  【使用规则】必须自己先把这个案例写完,并让 AI 验收通过后,才能打开本文件对照学习。
            直接抄参考代码 = 白学。
  【测试小技巧】想快点看到「活动已开始」,把下面的 10 * 60 * 1000 改成 5 * 1000(5 秒)即可。
  【UI 说明】本案例使用统一设计系统,令牌含义见注释。
-->
<style>
  /* ===== 设计令牌(全部案例共用,值保持一致)===== */
  :root {
    --brand: #0e9f6e;        /* 主色:清新绿(呼应小兔鲜) */
    --brand-dark: #057a55;   /* hover 加深 */
    --brand-soft: #e6f6f0;   /* 主色浅底(标签、选中态背景) */
    --ink: #111827;          /* 主文字 */
    --ink-2: #6b7280;        /* 次要文字 */
    --bg: #f2f5f4;           /* 页面画布:带一点绿意的浅灰 */
    --card: #ffffff;
    --line: #e5e7eb;
    --danger: #dc2626;
    --radius: 14px;
    --shadow: 0 1px 2px rgba(16,24,40,.05), 0 10px 28px rgba(16,24,40,.07);
  }
  body {
    font-family: -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    background: var(--bg);
    color: var(--ink);
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 24px;
    margin: 0;
    box-sizing: border-box;
  }
  .case-card {
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 32px;
    width: 400px;
    max-width: 100%;
    box-sizing: border-box;
    transition: background-color .15s ease;
  }
  /* 案例头部:eyebrow 标签 + 标题 + 一句话说明 */
  .case-head { margin: 0 0 20px; }
  .eyebrow {
    margin: 0 0 6px;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: var(--brand);
  }
  .case-title { margin: 0 0 6px; font-size: 21px; font-weight: 700; line-height: 1.3; }
  .case-desc { margin: 0; font-size: 14px; color: var(--ink-2); line-height: 1.6; }

  /* 倒计时展示区:浅底舞台 + 三个翻牌式数字方块 */
  .stage {
    background: var(--bg);
    border-radius: 10px;
    padding: 20px 16px 22px;
    text-align: center;
  }
  .tip { margin: 0 0 14px; font-size: 13px; color: var(--ink-2); }
  .timer {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 8px;
    min-height: 62px;
  }
  .unit {
    display: grid;
    place-items: center;
    min-width: 64px;
    padding: 15px 10px;
    /* 上半片微亮、下半片 --ink,模拟翻牌卡的上下两片 */
    background: linear-gradient(180deg, #1f2937 0%, #1f2937 50%, var(--ink) 50%, var(--ink) 100%);
    color: #fff;
    border-radius: 10px;
    box-shadow: 0 2px 6px rgba(16,24,40,.25);
    font-size: 28px;
    font-weight: 700;
    line-height: 1;
    font-variant-numeric: tabular-nums; /* 等宽数字:跳动时宽度不变,页面不抖 */
  }
  .colon {
    font-size: 22px;
    font-weight: 700;
    color: var(--ink-2);
  }
  /* 结束态:#timer 里只剩「活动已开始」文字,整卡切换为 --brand-soft */
  .timer.started {
    font-size: 26px;
    font-weight: 700;
    color: var(--brand-dark);
  }
  .case-card:has(.timer.started) { background: var(--brand-soft); }
  .case-card:has(.timer.started) .stage { background: transparent; }
  .case-card:has(.timer.started) .tip { color: var(--brand-dark); }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; animation: none !important; }
  }
</style>
</head>
<body>
<main class="case-card">
  <header class="case-head">
    <p class="eyebrow">WEEK 3 · 定时器</p>
    <h1 class="case-title">⚡ 限时秒杀</h1>
    <p class="case-desc">每秒用「目标时间 − 当前时间」重算剩余毫秒,结束后清除定时器。</p>
  </header>
  <section class="stage">
    <p class="tip">距离活动开始还剩</p>
    <div class="timer" id="timer">
      <span class="unit" id="hh">--</span><span class="colon">:</span><span class="unit" id="mm">--</span><span class="colon">:</span><span class="unit" id="ss">--</span>
    </div>
  </section>
</main>

<script>
  const timerEl = document.querySelector('#timer');
  // 仅 UI:时 / 分 / 秒三个翻牌方块,render 里分别写入
  const hoursEl = document.querySelector('#hh');
  const minutesEl = document.querySelector('#mm');
  const secondsEl = document.querySelector('#ss');

  // 目标时间 = 现在的时间戳 + 10 分钟(毫秒)。
  // Date.now() 返回从 1970-01-01 到现在的毫秒数,用「毫秒数」做加减法比操作年月日简单得多。
  // 10 分钟 = 10 * 60 秒 * 1000 毫秒,写成算式比直接写 600000 更容易看懂和修改。
  const targetTime = Date.now() + 10 * 60 * 1000;

  // 把数字补成两位字符串:5 -> '05',12 -> '12'。
  // padStart(2, '0') 的意思是:如果字符串不够 2 位,就在「前面」补 '0'。
  // 注意要先用 String() 把数字转成字符串,数字本身没有 padStart 方法。
  const pad = (n) => String(n).padStart(2, '0');

  const render = () => {
    // 剩余毫秒数。每次都重新用「目标时间 - 当前时间」计算,
    // 而不是维护一个每秒减 1 的变量——因为 setInterval 并不精确,
    // 页面切到后台时甚至会暂停,靠减 1 累计会越来越不准。
    const remaining = targetTime - Date.now();

    if (remaining <= 0) {
      timerEl.textContent = '活动已开始 🎉';
      timerEl.classList.add('started');
      // 【必须清除定时器!】如果不 clearInterval,这个函数会每秒继续执行一次,
      // 一直到页面关闭为止:白白消耗性能,还会反复改写 DOM。
      // 在真实项目里(尤其是单页应用),忘记清除定时器是最常见的内存泄漏原因之一。
      clearInterval(timerId);
      return;
    }

    // 把毫秒换算成 时:分:秒。
    // Math.floor 向下取整;% 取余数,用来去掉已经算进上一级单位的部分。
    // 例如 remaining = 599000 毫秒 -> 总共 599 秒 -> 0 时 9 分 59 秒。
    const totalSeconds = Math.floor(remaining / 1000);
    const hours = Math.floor(totalSeconds / 3600);
    const minutes = Math.floor((totalSeconds % 3600) / 60);
    const seconds = totalSeconds % 60;

    // 仅 UI 改动:原来是拼成 `HH:MM:SS` 一个字符串写进 #timer,
    // 现在分别写进三个方块,换算逻辑和数值完全不变。
    hoursEl.textContent = pad(hours);
    minutesEl.textContent = pad(minutes);
    secondsEl.textContent = pad(seconds);
  };

  // setInterval 返回一个数字 id,必须保存下来,之后 clearInterval(id) 才能停掉它。
  const timerId = setInterval(render, 1000);

  // setInterval 要等 1 秒后才第一次执行,页面刚打开会有 1 秒的空白,
  // 所以先手动调用一次,立刻显示出初始时间。
  render();
</script>
</body>
</html>
