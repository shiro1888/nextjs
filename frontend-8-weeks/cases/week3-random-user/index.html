<!--
  【案例名】随机用户卡片
  【练什么】fetch 请求真实接口 + async/await + try/catch + 三态渲染
           (同一块区域,根据「加载中 / 失败 / 成功」三种状态显示不同内容)
  【怎么运行】双击本文件用浏览器打开,点击「换一个用户」按钮(需要联网)。
  【使用规则】必须自己先写完并让 AI 验收后,才能打开本文件对照。
            直接抄答案等于白学,到时候面试写不出来的还是你自己。
  【特别注明】这是第 3 周「天气查询」验收项目的同款套路:
            点按钮 → 显示加载中 → 成功就渲染数据 / 失败就显示错误 + 重试按钮。
            天气项目必须自己独立写,不提供答案!
-->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>随机用户卡片</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: system-ui, sans-serif;
      background: linear-gradient(135deg, #667eea, #764ba2);
    }
    .app {
      width: 320px;
      text-align: center;
      color: #fff;
    }
    #load-btn {
      padding: 10px 24px;
      font-size: 16px;
      border: none;
      border-radius: 8px;
      background: #ffd166;
      cursor: pointer;
    }
    /* 按钮禁用时给用户一个"不能点"的视觉反馈 */
    #load-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    #card {
      margin-top: 20px;
      padding: 24px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.95);
      color: #333;
      min-height: 200px;
    }
    .avatar {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      border: 4px solid #667eea;
    }
    .error {
      color: #e63946;
    }
    #retry-btn {
      padding: 6px 16px;
      border: 1px solid #e63946;
      border-radius: 6px;
      background: #fff;
      color: #e63946;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="app">
    <h1>🎲 随机用户卡片</h1>
    <button id="load-btn">换一个用户</button>
    <div id="card">
      <p>点上面的按钮,随机请求一位用户</p>
    </div>
  </div>

  <script>
    const btn = document.querySelector('#load-btn');
    const card = document.querySelector('#card');

    // 成功态:把接口返回的用户对象渲染成卡片
    const renderUser = (user) => {
      // 接口返回的是层层嵌套的对象,用解构一次取出要用的字段,
      // 比到处写 user.name.first 更清爽
      const { picture, name, email, location } = user;
      card.innerHTML = `
        <img class="avatar" src="${picture.large}" alt="用户头像" />
        <h2>${name.first} ${name.last}</h2>
        <p>📧 ${email}</p>
        <p>🌍 ${location.country}</p>
      `;
    };

    // 失败态:显示错误信息 + 重试按钮
    const renderError = (message) => {
      card.innerHTML = `
        <p class="error">出错了:${message}</p>
        <button id="retry-btn">重试</button>
      `;
      // 重试按钮是上面 innerHTML 刚插进页面的"新元素",
      // 必须在插入之后再查找、再绑事件,写在页面加载时是绑不上的
      document.querySelector('#retry-btn').addEventListener('click', loadUser);
    };

    const loadUser = async () => {
      // 加载态:先给用户反馈,再发请求;同时禁用按钮防止连点发出多个请求
      card.innerHTML = '<p>加载中...</p>';
      btn.disabled = true;
      try {
        const res = await fetch('https://randomuser.me/api/');
        // 注意:fetch 只有在断网这类情况才会自己抛错,
        // 服务器返回 404 / 500 时它认为"请求成功了",所以要手动检查 res.ok
        if (!res.ok) {
          throw new Error(`请求失败,状态码 ${res.status}`);
        }
        const data = await res.json();
        // 这个接口把用户放在 results 数组里,取第一个
        renderUser(data.results[0]);
      } catch (err) {
        // 上面 throw 的错、断网错、JSON 解析错,全都会掉进这里
        renderError(err.message);
      } finally {
        // finally 不管成功失败都执行,恢复按钮正好写在这里,只写一次
        btn.disabled = false;
      }
    };

    btn.addEventListener('click', loadUser);
  </script>
</body>
</html>
