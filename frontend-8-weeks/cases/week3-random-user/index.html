<!--
  【案例名】随机用户卡片
  【练什么】fetch 请求真实接口 + async/await + try/catch + 三态渲染
           (同一块区域,根据「加载中 / 失败 / 成功」三种状态显示不同内容)
  【怎么运行】双击本文件用浏览器打开,点击「换一个用户」按钮(需要联网)。
  【使用规则】必须自己先写完并让 AI 验收后,才能打开本文件对照。
            直接抄答案等于白学,到时候面试写不出来的还是你自己。
  【特别注明】这是第 3 周「天气查询」验收项目的同款套路:
            点按钮 → 显示加载中 → 成功就渲染数据 / 失败就显示错误 + 重试按钮。
            天气项目必须自己独立写,不提供答案!
  【UI 说明】本案例使用统一设计系统,令牌含义见注释。
-->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>随机用户卡片</title>
  <style>
    :root {
      --brand: #0e9f6e;        /* 主色:清新绿(呼应小兔鲜) */
      --brand-dark: #057a55;   /* hover 加深 */
      --brand-soft: #e6f6f0;   /* 主色浅底(标签、选中态背景) */
      --ink: #111827;          /* 主文字 */
      --ink-2: #6b7280;        /* 次要文字 */
      --bg: #f2f5f4;           /* 页面画布:带一点绿意的浅灰 */
      --card: #ffffff;
      --line: #e5e7eb;
      --danger: #dc2626;
      --radius: 14px;
      --shadow: 0 1px 2px rgba(16,24,40,.05), 0 10px 28px rgba(16,24,40,.07);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: var(--bg);
      color: var(--ink);
      font-family: -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    }
    .app {
      width: 100%;
      max-width: 380px;
      background: var(--card);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 28px;
    }
    .eyebrow {
      margin: 0 0 6px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: var(--brand);
    }
    .title { margin: 0 0 4px; font-size: 21px; font-weight: 700; }
    .subtitle { margin: 0 0 20px; font-size: 14px; color: var(--ink-2); }
    button { font: inherit; }
    #load-btn {
      display: block;
      width: 100%;
      padding: 10px 18px;
      font-size: 15px;
      font-weight: 600;
      border: none;
      border-radius: 10px;
      background: var(--brand);
      color: #fff;
      cursor: pointer;
      transition: background .15s ease, transform .15s ease;
    }
    #load-btn:hover { background: var(--brand-dark); transform: translateY(-1px); }
    #load-btn:focus-visible { outline: 2px solid var(--brand-dark); outline-offset: 2px; }
    /* 按钮禁用时给用户一个"不能点"的视觉反馈 */
    #load-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      background: var(--brand);
      transform: none;
    }
    /* 三态共用的状态区域:空 / 加载中 / 失败 / 成功都渲染在这块 */
    #card {
      margin-top: 20px;
      min-height: 248px;
      display: grid;
      place-items: center;
      padding: 24px 20px;
      border: 1px dashed var(--line);
      border-radius: 10px;
      text-align: center;
    }
    /* 空状态:居中的次要色说明文字 */
    .empty { margin: 0; font-size: 14px; color: var(--ink-2); }
    /* 加载态:旋转圆环 */
    .spinner {
      display: inline-block;
      width: 36px;
      height: 36px;
      border: 4px solid var(--brand-soft);
      border-top-color: var(--brand);
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .state-text { margin: 12px 0 0; font-size: 14px; color: var(--ink-2); }
    /* 失败态:danger 提示条 + 重试按钮 */
    .error-bar {
      margin: 0 0 14px;
      padding: 10px 14px;
      border-radius: 10px;
      background: rgba(220, 38, 38, .07);
      border: 1px solid rgba(220, 38, 38, .25);
      color: var(--danger);
      font-size: 14px;
    }
    #retry-btn {
      padding: 8px 16px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--card);
      color: var(--ink);
      cursor: pointer;
      transition: border-color .15s ease, color .15s ease, transform .15s ease;
    }
    #retry-btn:hover { border-color: var(--brand); color: var(--brand); transform: translateY(-1px); }
    #retry-btn:focus-visible { outline: 2px solid var(--brand-dark); outline-offset: 2px; }
    /* 成功态:用户名片 */
    .avatar {
      width: 96px;
      height: 96px;
      border-radius: 50%;
      border: 4px solid var(--brand-soft);
      background: var(--brand-soft);
    }
    .user-name { margin: 12px 0 6px; font-size: 18px; font-weight: 700; color: var(--ink); }
    .user-meta { margin: 2px 0; font-size: 13px; color: var(--ink-2); }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        transition: none !important;
        animation: none !important;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <p class="eyebrow">Week 3 · fetch 三态</p>
    <h1 class="title">🎲 随机用户卡片</h1>
    <p class="subtitle">点按钮请求真实接口,同一块区域按「加载 / 失败 / 成功」切换。</p>
    <button id="load-btn">换一个用户</button>
    <div id="card">
      <p class="empty">点上面的按钮,随机请求一位用户</p>
    </div>
  </div>

  <script>
    const btn = document.querySelector('#load-btn');
    const card = document.querySelector('#card');

    // 成功态:把接口返回的用户对象渲染成卡片
    const renderUser = (user) => {
      // 接口返回的是层层嵌套的对象,用解构一次取出要用的字段,
      // 比到处写 user.name.first 更清爽
      const { picture, name, email, location } = user;
      card.innerHTML = `
        <div class="user">
          <img class="avatar" src="${picture.large}" alt="用户头像" />
          <h2 class="user-name">${name.first} ${name.last}</h2>
          <p class="user-meta">📧 ${email}</p>
          <p class="user-meta">🌍 ${location.country}</p>
        </div>
      `;
    };

    // 失败态:显示错误信息 + 重试按钮
    const renderError = (message) => {
      card.innerHTML = `
        <div class="state">
          <p class="error-bar">⚠️ 出错了:${message}</p>
          <button id="retry-btn">重试</button>
        </div>
      `;
      // 重试按钮是上面 innerHTML 刚插进页面的"新元素",
      // 必须在插入之后再查找、再绑事件,写在页面加载时是绑不上的
      document.querySelector('#retry-btn').addEventListener('click', loadUser);
    };

    const loadUser = async () => {
      // 加载态:先给用户反馈,再发请求;同时禁用按钮防止连点发出多个请求
      card.innerHTML = `
        <div class="state">
          <span class="spinner" aria-hidden="true"></span>
          <p class="state-text">加载中...</p>
        </div>
      `;
      btn.disabled = true;
      try {
        const res = await fetch('https://randomuser.me/api/');
        // 注意:fetch 只有在断网这类情况才会自己抛错,
        // 服务器返回 404 / 500 时它认为"请求成功了",所以要手动检查 res.ok
        if (!res.ok) {
          throw new Error(`请求失败,状态码 ${res.status}`);
        }
        const data = await res.json();
        // 这个接口把用户放在 results 数组里,取第一个
        renderUser(data.results[0]);
      } catch (err) {
        // 上面 throw 的错、断网错、JSON 解析错,全都会掉进这里
        renderError(err.message);
      } finally {
        // finally 不管成功失败都执行,恢复按钮正好写在这里,只写一次
        btn.disabled = false;
      }
    };

    btn.addEventListener('click', loadUser);
  </script>
</body>
</html>
