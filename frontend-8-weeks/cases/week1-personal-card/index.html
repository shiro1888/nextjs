<!DOCTYPE html>
<!--
  【案例名】个人名片页
  【练什么】盒模型(padding/border-radius/box-shadow)、Flex 布局(居中、换行)、
            CSS 渐变、响应式(媒体查询 @media)
  【怎么运行】双击本文件,用浏览器打开即可;按 F12 → 切换设备工具栏,
            把宽度调到 375px 看窄屏效果
  【使用规则】必须自己先写完并让 AI 验收后,才能打开本文件对照!
-->
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <!-- viewport 这一行是响应式的前提:没有它,手机会把页面当 980px 宽来缩放 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>个人名片</title>
  <style>
    /* 通配符清零:浏览器默认给 body、h1 等加了 margin,先清掉才好精确控制 */
    * {
      margin: 0;
      padding: 0;
      /* border-box 让 width 包含 padding 和边框,算尺寸不容易炸版 */
      box-sizing: border-box;
    }

    body {
      /* 让卡片在整个视口里水平垂直居中:Flex 三件套 */
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh; /* 至少占满一屏高,居中才有意义 */
      background: linear-gradient(135deg, #667eea, #764ba2);
      font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
      padding: 20px; /* 窄屏时卡片不会贴着屏幕边缘 */
    }

    .card {
      background: #fff;
      width: 100%;
      max-width: 380px; /* 宽屏最多 380px,窄屏自动缩到 100%,这就是最简单的响应式 */
      border-radius: 16px;
      /* 阴影:x偏移 y偏移 模糊半径 颜色,rgba 最后一位是透明度 */
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
      padding: 40px 30px;
      text-align: center;
    }

    .avatar {
      width: 100px;
      height: 100px;
      /* 圆形头像的关键:正方形 + 圆角 50% */
      border-radius: 50%;
      background: linear-gradient(135deg, #ffd89b, #f7797d);
      /* 用 Flex 让 emoji 在圆里居中 */
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 48px;
      margin: 0 auto 20px; /* 左右 auto = 块级元素水平居中 */
      border: 4px solid #f0f0f0;
    }

    .name {
      font-size: 24px;
      color: #333;
      margin-bottom: 8px;
    }

    .intro {
      font-size: 14px;
      color: #888;
      line-height: 1.6;
      margin-bottom: 24px;
    }

    .tags {
      display: flex;
      flex-wrap: wrap; /* 标签放不下就换行,不会挤爆卡片 */
      justify-content: center;
      gap: 10px; /* gap 比 margin 好用:只在元素之间留缝,两端不留 */
      margin-bottom: 28px;
    }

    .tag {
      /* 胶囊样式:小 padding + 超大圆角 */
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 13px;
      background: #eef2ff;
      color: #5a67d8;
    }

    .contact-btn {
      display: inline-block;
      padding: 12px 40px;
      border: none;
      border-radius: 999px;
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: #fff;
      font-size: 16px;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    /* hover 给用户"这个能点"的反馈 */
    .contact-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(102, 126, 234, 0.5);
    }

    /* 窄屏(手机)适配:屏幕宽 ≤480px 时,适当缩小内边距和字号 */
    @media (max-width: 480px) {
      .card {
        padding: 30px 20px;
      }
      .avatar {
        width: 80px;
        height: 80px;
        font-size: 38px;
      }
      .name {
        font-size: 20px;
      }
    }
  </style>
</head>
<body>
  <div class="card">
    <!-- 图片用渐变色块 + emoji 代替,不依赖外部文件 -->
    <div class="avatar">🐰</div>
    <h1 class="name">小白同学</h1>
    <p class="intro">零基础转行前端中,目标是 8 周写出自己的 Next.js 项目。</p>
    <div class="tags">
      <span class="tag">HTML</span>
      <span class="tag">CSS</span>
      <span class="tag">JavaScript</span>
      <span class="tag">React</span>
      <span class="tag">Next.js</span>
    </div>
    <button class="contact-btn">联系我</button>
  </div>
</body>
</html>
