<!DOCTYPE html>
<!--
  【案例名】Tab 栏切换(事件委托版)
  【练什么】
    1. 事件委托:监听父元素一个,顶替逐个绑定 N 个
    2. classList.toggle 配合索引做「排他」高亮
    3. data-* 自定义属性在元素和数据之间传递信息
  【怎么运行】双击本文件,用浏览器打开即可,无需任何服务器
  【使用规则】必须自己先写完一版、并让 AI 验收通过之后,
             才能打开本文件对照学习,否则等于抄答案,练不到手!
  【UI 说明】本案例使用统一设计系统,令牌含义见注释
-->
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>Tab 栏切换</title>
  <style>
    /* ===== 设计令牌:整套案例共用一套变量,换主题只改这里 ===== */
    :root {
      --brand: #0e9f6e;        /* 主色:清新绿(呼应小兔鲜) */
      --brand-dark: #057a55;   /* hover 加深 */
      --brand-soft: #e6f6f0;   /* 主色浅底(标签、选中态背景) */
      --ink: #111827;          /* 主文字 */
      --ink-2: #6b7280;        /* 次要文字 */
      --bg: #f2f5f4;           /* 页面画布:带一点绿意的浅灰 */
      --card: #ffffff;
      --line: #e5e7eb;
      --danger: #dc2626;
      --radius: 14px;
      --shadow: 0 1px 2px rgba(16,24,40,.05), 0 10px 28px rgba(16,24,40,.07);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: var(--bg);
      color: var(--ink);
      font-family: -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    }
    /* 内容区:白色卡片,案例头部 + tab 栏 + 面板 */
    .tab-box {
      width: 560px;
      max-width: 100%;
      background: var(--card);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 28px;
    }
    .case-head { margin-bottom: 18px; }
    .eyebrow {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: var(--brand);
    }
    .case-head h1 { font-size: 21px; font-weight: 700; margin: 6px 0 4px; }
    .case-head p { font-size: 14px; color: var(--ink-2); }

    .tab-header {
      display: flex;
      border-bottom: 1px solid var(--line);
    }
    .tab-btn {
      flex: 1;
      position: relative;
      padding: 12px 0;
      border: none;
      background: transparent;
      font: inherit;
      font-size: 15px;
      color: var(--ink-2);
      cursor: pointer;
      transition: color .15s ease, background .15s ease;
    }
    .tab-btn:hover { color: var(--ink); background: var(--brand-soft); }
    .tab-btn:focus-visible {
      outline: none;
      border-radius: 8px 8px 0 0;
      box-shadow: inset 0 0 0 2px rgba(14, 159, 110, 0.45);
    }
    /* 当前选中的选项卡:主题色文字 + 底部 2px 主题色指示条 */
    .tab-btn.active {
      color: var(--brand);
      font-weight: 700;
      background: transparent;
    }
    .tab-btn.active::after {
      content: '';
      position: absolute;
      left: 22%;
      right: 22%;
      bottom: -1px; /* 压在 tab-header 的分隔线上 */
      height: 2px;
      border-radius: 2px;
      background: var(--brand);
    }
    .panel {
      display: none; /* 默认全部隐藏 */
      padding: 20px 2px 0;
      line-height: 1.8;
      font-size: 14px;
      color: var(--ink);
      font-variant-numeric: tabular-nums; /* 面板里的参数、评价数等数字等宽对齐 */
      min-height: 140px;
    }
    .panel.active { display: block; } /* 只显示带 active 的那一块 */

    /* 尊重系统「减弱动态效果」:关闭过渡动画 */
    @media (prefers-reduced-motion: reduce) {
      * { transition: none !important; animation: none !important; }
    }
  </style>
</head>
<body>
  <div class="tab-box">
    <header class="case-head">
      <span class="eyebrow">WEEK 3 · 事件委托</span>
      <h1>Tab 栏切换</h1>
      <p>父元素只绑一个监听器,靠事件冒泡接住所有按钮的点击。</p>
    </header>
    <!-- 每个按钮用 data-index 记住自己是第几个,点击时读出来用 -->
    <div class="tab-header">
      <button class="tab-btn active" data-index="0">商品介绍</button>
      <button class="tab-btn" data-index="1">规格参数</button>
      <button class="tab-btn" data-index="2">用户评价</button>
    </div>
    <div class="tab-body">
      <div class="panel active">
        这里是「商品介绍」的内容。可以放商品图文详情、卖点说明等。
      </div>
      <div class="panel">
        这里是「规格参数」的内容。例如:重量 300g、颜色 星空黑、保修 12 个月。
      </div>
      <div class="panel">
        这里是「用户评价」的内容。例如:好评率 98%,共 12345 条评价。
      </div>
    </div>
  </div>

  <script>
    const header = document.querySelector('.tab-header');
    const btns = [...header.children];
    const panels = [...document.querySelectorAll('.panel')];

    // 【为什么用事件委托,而不是给每个按钮各绑一个监听器?】
    // 1. 省代码省内存:不管有 3 个还是 300 个 tab,都只需要 1 个监听器;
    //    逐个绑定则要 N 个,每个监听器都占内存。
    // 2. 动态新增也能用:将来用 JS 新插入一个 tab 按钮,不需要再补绑事件,
    //    因为监听器在父元素身上,新按钮的点击照样会「冒泡」上来被接住。
    // 3. 原理是事件冒泡:点击子元素后,事件会沿着 DOM 树往上传,
    //    传到父元素 .tab-header 时被这里的监听器捕获,
    //    再通过 e.target 拿到「真正被点的那个元素」。
    header.addEventListener('click', (e) => {
      // closest 从被点元素向上找最近的 .tab-btn;
      // 点到的不是按钮(比如按钮间的缝隙)就返回 null,直接忽略
      const btn = e.target.closest('.tab-btn');
      if (!btn) return;

      const index = Number(btn.dataset.index);

      // 「排他」写法:遍历所有按钮/面板,只有序号等于 index 的才加 active。
      // toggle 的第二个参数是布尔值:true 加类、false 移除类,
      // 比先全部移除再单独添加的两步写法更简洁
      btns.forEach((b, i) => b.classList.toggle('active', i === index));
      panels.forEach((p, i) => p.classList.toggle('active', i === index));
    });
  </script>
</body>
</html>
