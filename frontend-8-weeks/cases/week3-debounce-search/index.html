<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>搜索防抖联想</title>
<!--
  【案例名】搜索防抖联想
  【练什么】input 事件、setTimeout / clearTimeout 实现防抖、数组 filter、动态渲染列表
  【怎么运行】直接双击本文件,在浏览器中打开即可;在输入框里试着快速打字,
            观察下方建议列表是「停止输入 500 毫秒后」才更新的。
  【使用规则】必须自己先把这个案例写完,并让 AI 验收通过后,才能打开本文件对照学习。
            直接抄参考代码 = 白学。
  【UI 说明】本案例使用统一设计系统,令牌含义见注释。
-->
<style>
  /* ===== 设计令牌(全部案例共用,值保持一致)===== */
  :root {
    --brand: #0e9f6e;        /* 主色:清新绿(呼应小兔鲜) */
    --brand-dark: #057a55;   /* hover 加深 */
    --brand-soft: #e6f6f0;   /* 主色浅底(标签、选中态背景) */
    --ink: #111827;          /* 主文字 */
    --ink-2: #6b7280;        /* 次要文字 */
    --bg: #f2f5f4;           /* 页面画布:带一点绿意的浅灰 */
    --card: #ffffff;
    --line: #e5e7eb;
    --danger: #dc2626;
    --radius: 14px;
    --shadow: 0 1px 2px rgba(16,24,40,.05), 0 10px 28px rgba(16,24,40,.07);
  }
  body {
    font-family: -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    background: var(--bg);
    color: var(--ink);
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 24px;
    margin: 0;
    box-sizing: border-box;
  }
  .case-card {
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 32px;
    width: 460px;
    max-width: 100%;
    box-sizing: border-box;
  }
  /* 案例头部:eyebrow 标签 + 标题 + 一句话说明 */
  .case-head { margin: 0 0 20px; }
  .eyebrow {
    margin: 0 0 6px;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: var(--brand);
  }
  .case-title { margin: 0 0 6px; font-size: 21px; font-weight: 700; line-height: 1.3; }
  .case-desc { margin: 0; font-size: 14px; color: var(--ink-2); line-height: 1.6; }

  /* 搜索框 + 悬浮建议列表:父容器 relative,列表 absolute 悬浮在下方 */
  .search-box { position: relative; }
  input {
    width: 100%;
    padding: 10px 12px;
    font-size: 15px;
    font-family: inherit;
    color: var(--ink);
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 10px;
    box-sizing: border-box;
    transition: border-color .15s ease, box-shadow .15s ease;
  }
  input::placeholder { color: var(--ink-2); }
  input:hover { border-color: #d1d5db; }
  input:focus,
  input:focus-visible {
    outline: none;
    border-color: var(--brand);
    box-shadow: 0 0 0 3px rgba(14,159,110,.18);
  }
  ul {
    list-style: none;
    position: absolute;
    top: calc(100% + 8px);
    left: 0;
    right: 0;
    z-index: 10;
    margin: 0;
    padding: 6px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 10px;
    box-shadow: var(--shadow);
    max-height: 320px;
    overflow-y: auto;
  }
  /* 列表被清空(innerHTML = '')时整个面板隐藏,不留一个空壳 */
  ul:empty { display: none; }
  li {
    padding: 9px 12px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 14px;
    color: var(--ink);
    transition: background-color .15s ease;
  }
  li:hover { background: var(--brand-soft); }
  /* 命中的关键字:加粗 + --brand-dark。
     pointer-events:none 是关键——点击落在 <b> 上时事件目标仍是外层 li,
     JS 里 e.target.tagName === 'LI' 的事件委托判断才不会失效 */
  li b {
    font-weight: 700;
    color: var(--brand-dark);
    pointer-events: none;
  }
  /* 空状态:居中的浅色说明,悬停不变色 */
  li.empty {
    padding: 22px 12px;
    text-align: center;
    color: var(--ink-2);
    cursor: default;
  }
  li.empty:hover { background: transparent; }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; animation: none !important; }
  }
</style>
</head>
<body>
<main class="case-card">
  <header class="case-head">
    <p class="eyebrow">WEEK 3 · 防抖</p>
    <h1 class="case-title">搜索防抖联想</h1>
    <p class="case-desc">停止输入 500 毫秒后才过滤渲染,连续敲击合并为一次执行。</p>
  </header>
  <div class="search-box">
    <input type="text" id="searchInput" placeholder="🔍 搜索前端知识点,如 react、flex…" />
    <ul id="suggestList"></ul>
  </div>
</main>

<script>
  // 内置的 20 个词条,真实项目里这一步通常是发请求向服务器要数据
  const keywords = [
    'javascript', 'typescript', 'react', 'vue', 'next.js',
    'node.js', 'flex 布局', 'grid 布局', 'css 动画', 'css 变量',
    'html 语义化', 'dom 操作', '事件冒泡', '事件委托', 'promise',
    'async/await', 'fetch 请求', '防抖与节流', '闭包', '原型链',
  ];

  const input = document.querySelector('#searchInput');
  const list = document.querySelector('#suggestList');

  // 【防抖原理,一段话讲清】用户每敲一个字都会触发一次 input 事件,如果每次都立刻
  // 去过滤/发请求,输入「react」这 5 个字母就会执行 5 次,前 4 次的结果马上被覆盖,
  // 全是浪费。防抖的思路是:每次触发时不立刻执行,而是「约定 500 毫秒后再执行」
  // (setTimeout);如果 500 毫秒内用户又输入了,就用 clearTimeout 取消上一次的约定,
  // 重新约一个 500 毫秒。这样只要用户还在连续输入,任务就一直被推迟,
  // 只有停止输入满 500 毫秒,最后那一次 setTimeout 才真正执行——多次触发合并成一次。
  // clearTimeout 是关键:不取消旧定时器的话,之前每次输入约定的任务到点都会执行,
  // 那就和不做防抖没区别了。
  let timerId = null;

  // 根据关键词过滤并渲染建议列表
  const renderSuggestions = (query) => {
    // 统一转小写再比较,这样输入 REACT 也能搜到 react(忽略大小写)
    const matched = keywords.filter((word) => word.toLowerCase().includes(query.toLowerCase()));

    if (matched.length === 0) {
      list.innerHTML = '<li class="empty">没有匹配的结果</li>';
      return;
    }

    // 用 map 把每个词条变成一段 <li> 字符串,再用 join('') 拼起来一次性插入。
    // 比在循环里反复 appendChild 更简洁,也只改一次 DOM。
    // 仅 UI 改动:把命中的关键字包一层 <b> 加粗高亮(能进到这里说明 includes
    // 已命中,indexOf 一定 >= 0);<b> 在 CSS 里设了 pointer-events:none,
    // 点击仍落在 li 上,下方的事件委托逻辑不受影响。
    list.innerHTML = matched
      .map((word) => {
        const start = word.toLowerCase().indexOf(query.toLowerCase());
        const end = start + query.length;
        return `<li>${word.slice(0, start)}<b>${word.slice(start, end)}</b>${word.slice(end)}</li>`;
      })
      .join('');
  };

  input.addEventListener('input', () => {
    // 先取消上一次还没执行的定时器(第一次输入时 timerId 是 null,
    // clearTimeout(null) 什么也不做,不会报错,所以不需要额外判断)
    clearTimeout(timerId);

    const query = input.value.trim();

    // 输入为空时立刻清空列表,不需要等 500 毫秒——清空是很轻的操作,
    // 而且用户删光文字后期望列表马上消失
    if (query === '') {
      list.innerHTML = '';
      return;
    }

    // 约定 500 毫秒后执行;timerId 记录下来,供下一次输入时取消
    timerId = setTimeout(() => {
      renderSuggestions(query);
    }, 500);
  });

  // 小福利:点击某条建议,把它填进输入框并收起列表。
  // 事件绑定在 ul 上而不是每个 li 上(事件委托),因为 li 是动态生成的,
  // 每次重新渲染后旧 li 上绑的事件都会随元素一起消失。
  list.addEventListener('click', (e) => {
    if (e.target.tagName === 'LI' && !e.target.classList.contains('empty')) {
      // 别忘了取消还没执行的防抖任务:如果用户敲完字 500 毫秒内就点了旧建议,
      // 不取消的话,那个到点的 setTimeout 会把刚收起的列表又渲染出来
      clearTimeout(timerId);
      input.value = e.target.textContent;
      list.innerHTML = '';
    }
  });
</script>
</body>
</html>
