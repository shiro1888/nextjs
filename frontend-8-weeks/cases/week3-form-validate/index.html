<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>注册表单验证</title>
<!--
  【案例名】注册表单验证
  【练什么】表单事件(blur / submit)、preventDefault、正则表达式初步、DOM 显示错误提示
  【怎么运行】直接双击本文件,在浏览器中打开即可
  【使用规则】必须自己先把这个案例写完,并让 AI 验收通过后,才能打开本文件对照学习。
            直接抄参考代码 = 白学。
  【UI 说明】本案例使用统一设计系统,令牌含义见注释。
-->
<style>
  /* ===== 设计令牌(全部案例共用,值保持一致)===== */
  :root {
    --brand: #0e9f6e;        /* 主色:清新绿(呼应小兔鲜) */
    --brand-dark: #057a55;   /* hover 加深 */
    --brand-soft: #e6f6f0;   /* 主色浅底(标签、选中态背景) */
    --ink: #111827;          /* 主文字 */
    --ink-2: #6b7280;        /* 次要文字 */
    --bg: #f2f5f4;           /* 页面画布:带一点绿意的浅灰 */
    --card: #ffffff;
    --line: #e5e7eb;
    --danger: #dc2626;
    --radius: 14px;
    --shadow: 0 1px 2px rgba(16,24,40,.05), 0 10px 28px rgba(16,24,40,.07);
  }
  body {
    font-family: -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    background: var(--bg);
    color: var(--ink);
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 24px;
    margin: 0;
    box-sizing: border-box;
  }
  .case-card {
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 32px;
    width: 380px;
    max-width: 100%;
    box-sizing: border-box;
  }
  /* 案例头部:eyebrow 标签 + 标题 + 一句话说明 */
  .case-head { margin: 0 0 24px; }
  .eyebrow {
    margin: 0 0 6px;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: var(--brand);
  }
  .case-title { margin: 0 0 6px; font-size: 21px; font-weight: 700; line-height: 1.3; }
  .case-desc { margin: 0; font-size: 14px; color: var(--ink-2); line-height: 1.6; }

  .field { margin-bottom: 14px; }
  label { display: block; margin-bottom: 6px; font-size: 13px; font-weight: 500; color: var(--ink); }
  input {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid var(--line);
    border-radius: 10px;
    font-size: 14px;
    font-family: inherit;
    color: var(--ink);
    background: var(--card);
    box-sizing: border-box; /* 让 width:100% 包含内边距,不然输入框会撑出容器 */
    transition: border-color .15s ease, box-shadow .15s ease;
  }
  input:hover { border-color: #d1d5db; }
  input:focus,
  input:focus-visible {
    outline: none;
    border-color: var(--brand);
    box-shadow: 0 0 0 3px rgba(14,159,110,.18);
  }
  /* 错误提示默认占位但不显示内容,避免出现提示时页面跳动 */
  .error { color: var(--danger); font-size: 12px; line-height: 16px; min-height: 16px; margin: 5px 0 0; }
  input.invalid { border-color: var(--danger); }
  input.invalid:focus { box-shadow: 0 0 0 3px rgba(220,38,38,.14); }
  /* 校验通过的输入框:品牌绿描边 */
  input.valid { border-color: var(--brand); }

  button {
    width: 100%;
    margin-top: 6px;
    padding: 10px 18px;
    border: none;
    border-radius: 10px;
    background: var(--brand);
    color: #fff;
    font-size: 15px;
    font-weight: 600;
    font-family: inherit;
    letter-spacing: .04em;
    cursor: pointer;
    transition: background-color .15s ease, transform .15s ease, box-shadow .15s ease;
  }
  button:hover { background: var(--brand-dark); transform: translateY(-1px); }
  button:active { transform: translateY(0); }
  button:focus-visible {
    outline: none;
    background: var(--brand-dark);
    box-shadow: 0 0 0 3px rgba(14,159,110,.28);
  }

  /* 成功提示条:--brand-soft 浅绿底,没有内容时整条隐藏 */
  .success {
    margin: 16px 0 0;
    padding: 10px 12px;
    background: var(--brand-soft);
    color: var(--brand-dark);
    border-radius: 10px;
    font-size: 14px;
    font-weight: 600;
    text-align: center;
  }
  .success:empty { display: none; }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; animation: none !important; }
    button:hover { transform: none; }
  }
</style>
</head>
<body>
<main class="case-card">
  <header class="case-head">
    <p class="eyebrow">WEEK 3 · 表单校验</p>
    <h1 class="case-title">注册表单验证</h1>
    <p class="case-desc">失焦时单项校验,提交时全量校验,错误提示同时显示。</p>
  </header>
  <!-- novalidate:关闭浏览器自带的校验气泡,完全由我们自己的 JS 来控制提示 -->
  <form id="regForm" novalidate>
    <div class="field">
      <label for="username">用户名(3-10 位字母或数字)</label>
      <input type="text" id="username" name="username" />
      <p class="error" id="username-error"></p>
    </div>
    <div class="field">
      <label for="phone">手机号</label>
      <input type="text" id="phone" name="phone" />
      <p class="error" id="phone-error"></p>
    </div>
    <div class="field">
      <label for="password">密码(至少 6 位)</label>
      <input type="password" id="password" name="password" />
      <p class="error" id="password-error"></p>
    </div>
    <div class="field">
      <label for="confirm">确认密码</label>
      <input type="password" id="confirm" name="confirm" />
      <p class="error" id="confirm-error"></p>
    </div>
    <button type="submit">注 册</button>
    <p class="success" id="successMsg"></p>
  </form>
</main>

<script>
  const form = document.querySelector('#regForm');
  const successMsg = document.querySelector('#successMsg');

  // 把「每个字段怎么校验」集中写成一个配置对象:
  // key 是输入框的 id,value 是校验函数——合法返回空字符串,不合法返回错误文案。
  // 这样新增字段只需要加一条配置,不用复制粘贴一大段 if/else。
  const validators = {
    username: (value) => {
      // ^ 和 $ 表示从头到尾整体匹配;[a-zA-Z0-9]{3,10} 表示 3 到 10 个字母或数字
      return /^[a-zA-Z0-9]{3,10}$/.test(value) ? '' : '用户名必须是 3-10 位字母或数字';
    },
    phone: (value) => {
      // 1 开头,第二位 3-9,后面再跟 9 个数字,共 11 位
      return /^1[3-9]\d{9}$/.test(value) ? '' : '请输入正确的 11 位手机号';
    },
    password: (value) => {
      return value.length >= 6 ? '' : '密码至少需要 6 位';
    },
    confirm: (value) => {
      // 确认密码要和密码框的「当前值」比较,所以在函数里实时读取,而不是提前存变量。
      // 注意也要 trim():validateField 传进来的 value 已经 trim 过,
      // 两边必须同样处理,否则密码首尾带空格时会误报「不一致」。
      const password = document.querySelector('#password').value.trim();
      return value === password ? '' : '两次输入的密码不一致';
    },
  };

  // 校验单个字段:返回 true 表示通过。错误信息显示在对应输入框下方的 <p> 里
  const validateField = (id) => {
    const input = document.querySelector(`#${id}`);
    const errorEl = document.querySelector(`#${id}-error`);
    const message = validators[id](input.value.trim());
    errorEl.textContent = message;
    // classList.toggle 第二个参数:true 加类,false 移除类,比 if/else 简洁
    input.classList.toggle('invalid', message !== '');
    // 仅 UI:通过时加 valid 类显示品牌绿描边,不影响任何校验逻辑
    input.classList.toggle('valid', message === '');
    return message === '';
  };

  // 给每个字段绑定 blur 事件(失去焦点时单项校验)
  // Object.keys 拿到 ['username', 'phone', ...],用 forEach 批量绑定,避免写四遍
  Object.keys(validators).forEach((id) => {
    document.querySelector(`#${id}`).addEventListener('blur', () => {
      validateField(id);
    });
  });

  form.addEventListener('submit', (e) => {
    // 注意:不能写成 .every(validateField),因为 every 遇到 false 会提前停止,
    // 后面的字段就不会显示错误提示了。先用 map 把每个字段都校验一遍,
    // 再用 every 判断是否全部通过,这样所有错误能同时显示出来。
    const results = Object.keys(validators).map((id) => validateField(id));
    const allPassed = results.every((ok) => ok);

    if (!allPassed) {
      // 阻止表单默认的提交行为(提交会刷新页面,错误提示就看不到了)
      e.preventDefault();
      successMsg.textContent = '';
      return;
    }
    // 本案例没有后端,通过时也阻止默认提交,只显示成功提示
    e.preventDefault();
    successMsg.textContent = '🎉 注册成功!';
  });
</script>
</body>
</html>
